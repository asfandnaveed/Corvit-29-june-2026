<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Javascript</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 id="heading">Hello, Corvit!</h1>

    <button class="btn btn-warning" onclick="changeText();">Change Text</button>


    <div>
        <img id="img" src="assets/images/1.jpg" alt="">
        <button class="btn btn-primary" onclick="changeImage();">Change Image</button>
    </div>


    <div class="mb-5">
        <div id="ageText"></div>
        <input id="ageInput" type="number" class="form-control">
        <button class="btn btn-warning" onclick="calculateAge();">Calculate Age</button>
    </div>


    <div class="mb-5">
        <label for="" class="form-label">Password</label>
        <div class="position-relative w-25">
            <input type="password" class="form-control">
            <div class="bg-primary px-3 py-0 position-absolute top-50 end-0 translate-middle-y me-3 text-white rounded-2" >
                <i class="bi bi-eye-fill"></i>
            </div>
        </div>
    </div>


    <script>

        function calculateAge() {
            var age = document.getElementById("ageInput").value;

            var ageText = document.getElementById("ageText");

            if (age > 40) {
                ageText.innerHTML = "<div class='alert alert-danger'>You are Old !</div>";
            } else {
                ageText.innerHTML = "<div class='alert alert-success'>You are Young !</div>";
            }

        }


        function changeImage() {
            document.getElementById("img").src = "assets/images/2.jpg";
        }

        function changeText() {

            let x = 5;
            var y = "Hello";
            const z = " Corvit";

            var headingTag = document.getElementById('heading');

            headingTag.innerHTML = x + y;
            headingTag.style.fontSize = '3rem';
            headingTag.style.color = 'green';
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
