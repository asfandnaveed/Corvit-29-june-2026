<!doctype html>
<html lang="en">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<body>
    <h1 id="heading">Hello, Corvit!</h1>

    <button class="btn btn-warning" onclick="changeText();">Change Text</button>


    <div>
        <img id="img" src="assets/images/1.jpg" alt="">
        <button class="btn btn-primary" onclick="changeImage();">Change Image</button>
    </div>


    <div class="mb-5">
        <div id="ageText"></div>
        <input id="ageInput" type="number" class="form-control">
        <button class="btn btn-warning" onclick="calculateAge();">Calculate Age</button>
    </div>


    <div class="mb-5">
        <label for="" class="form-label">Password</label>
        <div class="position-relative w-25">
            <input id="inpPass" type="password" class="form-control" placeholder="***********">
            <div onclick="showPassword();" class="bg-primary px-3 py-0 position-absolute top-50 end-0 translate-middle-y me-3 text-white rounded-2" >
                <i id="passEye" class="bi bi-eye-fill"></i>
            </div>
        </div>
    </div>


    <div class="container">
        <div id="products" class="row"></div>
    </div>
    <button class="btn btn-success" onclick="getProducts();">Products</button>

    

    <script>

        

        function getProducts (){
            var products = ["Steak","prawns","muffins","biryani","macroni"];//array
            
            var htmlData = document.getElementById("products");


            products.map( (data)=>{
                console.log(data);

            // for(var i=0; i < products.length; i++){

            //                     ${products[i]}
            //                 </div>
            //             </div>
            //         </div>
            //     </div>
            //     `;
            // }
            
        
        }   


        function showPassword(){
            var input = document.getElementById("inpPass");

            var eyeIcon = document.getElementById("passEye");

            if(input.type == 'password'){
                input.type= 'text';
                eyeIcon.classList.remove('bi-eye-fill');
                eyeIcon.classList.add('bi-eye-slash-fill');

            }else{
                input.type='password';
                eyeIcon.classList.remove('bi-eye-slash-fill');
                eyeIcon.classList.add('bi-eye-fill');
            }

        }

        function calculateAge() {
            var age = document.getElementById("ageInput").value;

            var ageText = document.getElementById("ageText");

            if (age > 40) {
                ageText.innerHTML = "<div class='alert alert-danger'>You are Old !</div>";
            } else {
                ageText.innerHTML = "<div class='alert alert-success'>You are Young !</div>";
            }

        }


        function changeImage() {
            document.getElementById("img").src = "assets/images/2.jpg";
        }

        function changeText() {

            let x = 5;
            var y = "Hello";
            const z = " Corvit";

            var headingTag = document.getElementById('heading');

            headingTag.innerHTML = x + y;
            headingTag.style.fontSize = '3rem';
            headingTag.style.color = 'green';
        }

    </script>
