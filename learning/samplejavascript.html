<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Javascript</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
        body {
            background-color: #FAFAFA;
        }

        /* Custom tweaks where Bootstrap utilities fall short */
        .date-badge {
            top: 15px;
            left: 0px;
            z-index: 10;
            background-color: #475569 !important;
        }

        .food-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50% !important;
            /* Force circular plate look */
        }

        /* Modern Cart Button Hover Effects */
        .qty-btn {
            width: 36px;
            height: 36px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .qty-btn:hover {
            background-color: #4F46E5 !important;
            color: white !important;
            border-color: #4F46E5 !important;
        }

        /* Right side media container sizing */
        .featured-media {
            border-color: #3B82F6 !important;
            /* Matches design's outer blue border */
            min-height: 500px;
        }

        .featured-image {
            object-fit: cover;
        }

        /* Dashed Play Button */
        .play-button {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border: 2px dashed rgba(255, 255, 255, 0.7);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.05) !important;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid white;
            margin-left: 6px;
        }
    </style>
</head>

<body class="py-5">

    <div class="container">
        <div class="row gx-5 align-items-start">

            <!-- Left Column: Content List -->
            <div class="col-md-6 pe-lg-5">
                <h2 class="fw-bolder mb-5 text-dark">Tasty Bites & News</h2>

                <!-- Item 1 -->
                <div class="d-flex align-items-center mb-5">
                    <div class="position-relative flex-shrink-0 me-4">
                        <span
                            class="position-absolute translate-middle badge rounded-pill shadow-sm date-badge px-3 py-2 fw-semibold">
                            23 Jul 2023
                        </span>
                        <!-- Replace src with your image -->
                        <img src="assets/images/foodplate.png" alt="Stir-Fried Noodles" class="food-img ">
                    </div>
                    <div>
                        <h5 class="fw-bold mb-3 lh-base">🍤 Savor the Sizzle: Stir-Fried Noodles with Shrimp Perfection
                        </h5>
                        <div class="text-muted small mb-3 d-flex gap-4">
                            <span>👤 By Li Wei</span>
                            <span>💬 27 Comments</span>
                        </div>

                        <!-- Modern Cart Controls -->
                        <div
                            class="d-inline-flex align-items-center bg-light rounded-pill p-1 shadow-sm border border-secondary-subtle">
                            <button
                                class="btn bg-white border rounded-circle fw-bold qty-btn shadow-sm d-flex justify-content-center align-items-center"
                                aria-label="Decrease quantity" onclick="subtractQuantity();">−</button>
                            <span class="fw-bold px-4 text-dark fs-6" id="counter">1</span>
                            <button
                                class="btn bg-white border rounded-circle fw-bold qty-btn shadow-sm d-flex justify-content-center align-items-center"
                                aria-label="Increase quantity" onclick="addQuantity();">+</button>
                        </div>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="d-flex align-items-center mb-5">
                    <div class="position-relative flex-shrink-0 me-4">
                        <span
                            class="position-absolute translate-middle badge rounded-pill shadow-sm date-badge px-3 py-2 fw-semibold">
                            23 Jul 2023
                        </span>
                        <!-- Replace src with your image -->
                        <img src="assets/images/foodplate.png" alt="Flavors Future" class="food-img shadow">
                    </div>
                    <div>
                        <h5 class="fw-bold mb-3 lh-base">A Sneak Peek Into the Future of Flavors</h5>
                        <div class="text-muted small mb-3 d-flex gap-4">
                            <span>👤 By Giulia Romano</span>
                            <span>💬 34 Comments</span>
                        </div>

                        <!-- Modern Cart Controls -->
                        <div
                            class="d-inline-flex align-items-center bg-light rounded-pill p-1 shadow-sm border border-secondary-subtle">
                            <button
                                class="btn bg-white border rounded-circle fw-bold qty-btn shadow-sm d-flex justify-content-center align-items-center"
                                aria-label="Decrease quantity">−</button>
                            <span class="fw-bold px-4 text-dark fs-6">1</span>
                            <button
                                class="btn bg-white border rounded-circle fw-bold qty-btn shadow-sm d-flex justify-content-center align-items-center"
                                aria-label="Increase quantity">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Featured Image/Video -->
            <div class="col-md-6">
                <div
                    class="position-relative rounded-4 overflow-hidden border border-4 featured-media shadow-lg w-100 h-100 d-block">
                    <!-- Replace src with your image -->
                    <img src="assets/images/Video.png" alt="Cooking in pan"
                        class="position-absolute w-100 h-100 featured-image">

                    <div
                        class="position-absolute top-50 start-50 translate-middle play-button rounded-4 d-flex justify-content-center align-items-center shadow-sm">
                        <div class="play-icon"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <button onclick="textVartiable()">Click</button>


    <script>
        var counter = 1;

        function addQuantity() {


            var counterId = document.getElementById("counter");

            counter++;
            counterId.innerHTML = counter;

        }

        function subtractQuantity() {

            var counterId = document.getElementById("counter");

            if (counter > 1) {
                counter--;
            }
            counterId.innerHTML = counter;
        }


        function textVartiable() {


            let y = 10;
            const z = 15;

            y=12;
            console.log(y);

            z=20;
            console.log(z);


        }

    </script>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
